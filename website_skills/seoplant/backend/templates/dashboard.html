<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEOplant Dashboard</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f8fafc; --text: #1e293b;
    --text-muted: #64748b; --border: #e2e8f0;
    --primary: #3B82F6; --green: #10B981; --red: #EF4444;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9;
            --text-muted: #94a3b8; --border: #334155; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  nav { border-bottom: 1px solid var(--border); padding: 16px 0; margin-bottom: 32px; }
  nav .flex { display: flex; justify-content: space-between; align-items: center; }
  nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; }
  nav a:hover { color: var(--primary); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: var(--radius); font-weight: 600; font-size: 14px; cursor: pointer; border: none; text-decoration: none; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); font-size: 12px; padding: 4px 12px; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--text-muted); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; }
  .badge-draft { background: #f1f5f9; color: #64748b; }
  .badge-live { background: #dcfce7; color: #166534; }
  .badge-error { background: #fee2e2; color: #991b1b; }
  .stat { font-size: 2rem; font-weight: 800; }
  .stat-label { font-size: 0.85rem; color: var(--text-muted); }
  .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: var(--radius); color: #fff; font-weight: 600; z-index: 999; display: none; }
  .toast-success { background: var(--green); }
  .toast-error { background: var(--red); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--bg); border-radius: 12px; padding: 32px; max-width: 480px; width: 90%; }
  .modal h2 { margin-bottom: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 4px; font-size: 14px; color: var(--text-muted); }
  .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-size: 14px; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
  .text-center { text-align: center; }
  .mt-2 { margin-top: 16px; }
  .mt-3 { margin-top: 24px; }
  .gap-2 { gap: 12px; }
  .section { padding: 32px 0; }
</style>
</head>
<body>
<nav>
  <div class="container flex">
    <a href="/dashboard" style="font-size:1.2rem;font-weight:700;color:var(--text);">SEOplant</a>
    <div class="flex" style="gap:20px;">
      <a href="/dashboard" id="nav-dashboard">Dashboard</a>
      <a href="#" id="btn-logout" style="display:none;">Logout</a>
      <a href="/dashboard/login" id="nav-login">Login</a>
    </div>
  </div>
</nav>

<div class="toast" id="toast"></div>

<!-- New Project Modal -->
<div class="modal-overlay" id="modal-new-project">
  <div class="modal">
    <h2>New SEO Project</h2>
    <div class="form-group">
      <label>Keyword / Niche</label>
      <input type="text" id="new-kw" placeholder="best hiking boots" />
    </div>
    <div class="form-group">
      <label>Site Type</label>
      <select id="new-type">
        <option value="website">Blog / Content Site</option>
        <option value="ecommerce">E-commerce / Affiliate</option>
        <option value="travel">Travel</option>
        <option value="saas">SaaS</option>
        <option value="docs">Documentation</option>
      </select>
    </div>
    <div class="form-group">
      <label>Project Name (optional)</label>
      <input type="text" id="new-name" placeholder="My SEO Site" />
    </div>
    <div class="flex gap-2" style="justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeModal('modal-new-project')">Cancel</button>
      <button class="btn btn-primary" onclick="createProject()">Create Project</button>
    </div>
  </div>
</div>

<div class="container section" id="app"></div>

<script>
const API = '';

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + (type || 'success');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function getToken() { return localStorage.getItem('seoplant_token'); }
function getUser() {
  try { return JSON.parse(localStorage.getItem('seoplant_user') || 'null'); }
  catch { return null; }
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { localStorage.clear(); renderLogin(); return null; }
  return res.json();
}

// ── Auth ──

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const data = await api('POST', '/api/auth/login', { email, password });
  if (data && data.access_token) {
    localStorage.setItem('seoplant_token', data.access_token);
    localStorage.setItem('seoplant_user', JSON.stringify(data.user));
    renderApp();
  } else {
    toast('Login failed. Check your email and password.', 'error');
  }
}

async function doRegister() {
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  const display_name = document.getElementById('reg-name').value;
  const data = await api('POST', '/api/auth/register', { email, password, display_name });
  if (data && data.access_token) {
    localStorage.setItem('seoplant_token', data.access_token);
    localStorage.setItem('seoplant_user', JSON.stringify(data.user));
    renderApp();
  } else {
    toast('Registration failed.', 'error');
  }
}

function doLogout() {
  localStorage.clear();
  renderApp();
}

// ── Projects ──

async function loadProjects() {
  const data = await api('GET', '/api/projects/');
  return data || [];
}

async function createProject() {
  const keyword = document.getElementById('new-kw').value;
  const site_type = document.getElementById('new-type').value;
  const name = document.getElementById('new-name').value;
  const data = await api('POST', '/api/projects/', { keyword, site_type, name });
  if (data && data.id) {
    closeModal('modal-new-project');
    toast('Project created!');
    renderApp();
  } else {
    toast('Failed to create project.', 'error');
  }
}

async function deleteProject(id) {
  if (!confirm('Delete this project?')) return;
  await api('DELETE', '/api/projects/' + id);
  toast('Project deleted.');
  renderApp();
}

async function analyzeProject(projectId, keyword, siteType) {
  toast('Analyzing competitors...');
  const data = await api('POST', '/api/seo/analyze-competitors', { keyword, site_type: siteType });
  if (data && !data.detail) {
    toast('Competitor analysis complete! ' + data.competitors_analyzed + ' competitors analyzed. Credits: ' + data.credits_remaining);
    renderApp();
  } else {
    toast(data.detail || 'Analysis failed', 'error');
  }
}

async function generatePlan(projectId, keyword, siteType) {
  toast('Generating SEO plan...');
  const data = await api('POST', '/api/seo/generate-plan', { keyword, site_type: siteType });
  if (data && !data.detail) {
    toast('SEO plan generated! Credits: ' + data.credits_remaining);
    renderApp();
  } else {
    toast(data.detail || 'Plan generation failed', 'error');
  }
}

// ── Render ──

function renderApp() {
  const user = getUser();
  const app = document.getElementById('app');
  document.getElementById('nav-login').style.display = user ? 'none' : 'inline';
  document.getElementById('btn-logout').style.display = user ? 'inline' : 'none';
  document.getElementById('nav-dashboard').style.display = user ? 'inline' : 'none';

  if (!user) {
    renderLogin();
    return;
  }

  loadProjects().then(projects => {
    const totalCredits = user.credits_remaining || 0;
    app.innerHTML = `
      <div class="grid-2" style="margin-bottom:32px;">
        <div class="card">
          <div class="stat-label">Credits Remaining</div>
          <div class="stat">${totalCredits}</div>
          <span class="badge badge-${user.plan === 'free' ? 'draft' : 'live'}">${user.plan}</span>
        </div>
        <div class="card">
          <div class="stat-label">Projects</div>
          <div class="stat">${projects.length}</div>
          <span style="color:var(--text-muted);font-size:14px;">${user.plan === 'free' ? 'Free tier: 1 site' : user.plan === 'pro' ? 'Pro: 10 sites' : 'Agency: 50 sites'}</span>
        </div>
      </div>

      <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>Your Projects</h2>
        <button class="btn btn-primary" onclick="openModal('modal-new-project')">+ New Project</button>
      </div>

      ${projects.length === 0 ? `
        <div class="card text-center" style="padding:48px;">
          <p style="color:var(--text-muted);margin-bottom:16px;">No projects yet. Create your first SEO project!</p>
          <button class="btn btn-primary" onclick="openModal('modal-new-project')">+ New Project</button>
        </div>
      ` : `
        <table>
          <thead><tr><th>Project</th><th>Keyword</th><th>Type</th><th>Status</th><th>Credits</th><th></th></tr></thead>
          <tbody>
            ${projects.map(p => `
              <tr>
                <td><strong>${p.name}</strong></td>
                <td>${p.keyword}</td>
                <td>${p.site_type}</td>
                <td><span class="badge badge-${p.status}">${p.status}</span></td>
                <td>${p.credits_spent || 0}</td>
                <td>
                  <div class="flex gap-2">
                    <button class="btn btn-sm btn-secondary" onclick="analyzeProject('${p.id}','${p.keyword}','${p.site_type}')">Analyze</button>
                    <button class="btn btn-sm btn-secondary" onclick="generatePlan('${p.id}','${p.keyword}','${p.site_type}')">Plan</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProject('${p.id}')">Delete</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    `;
  });
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="max-width:400px;margin:60px auto;">
      <div class="card">
        <h2 style="text-align:center;margin-bottom:24px;">Login to SEOplant</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Your password" onkeydown="if(event.key==='Enter')doLogin()" />
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Login</button>
        <p class="text-center mt-2" style="font-size:14px;color:var(--text-muted);">
          Don't have an account?
          <a href="#" onclick="renderRegister();return false;">Register</a>
        </p>
      </div>
    </div>
  `;
}

function renderRegister() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="max-width:400px;margin:60px auto;">
      <div class="card">
        <h2 style="text-align:center;margin-bottom:24px;">Create Account</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="reg-name" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Min 8 characters" onkeydown="if(event.key==='Enter')doRegister()" />
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="doRegister()">Create Account</button>
        <p class="text-center mt-2" style="font-size:14px;color:var(--text-muted);">
          Already registered?
          <a href="#" onclick="renderLogin();return false;">Login</a>
        </p>
      </div>
    </div>
  `;
}

// Boot
renderApp();
</script>
</body>
</html>
