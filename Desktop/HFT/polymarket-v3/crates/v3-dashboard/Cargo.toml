[package]
name = "v3-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
anyhow = "1"
futures-util = "0.3"

[dependencies.v3-core]
path = "../v3-core"

[dependencies.v3-risk]
path = "../v3-risk"
