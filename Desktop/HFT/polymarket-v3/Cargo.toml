[workspace]
resolver = "2"
members = [
    "crates/v3-core",
    "crates/v3-signal",
    "crates/v3-strategy",
    "crates/v3-execution",
    "crates/v3-risk",
    "crates/v3-bot",
    "crates/v3-backtest",
    "crates/v3-mm-core",
    "crates/v3-mm-exchange",
    "crates/v3-mm-risk",
    # TODO: Uncomment when implemented
    # "crates/v3-dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Polymarket V3 Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP/WebSocket
reqwest = { version = "0.12", features = ["json"] }
tungstenite = "0.24"

# Crypto/Web3
alloy = { version = "1.7", features = ["full"] }
alloy-primitives = "1.5"
polymarket-client-sdk = { version = "0.4", features = ["clob"] }
hex = "0.4"

# Decimal math
rust_decimal = { version = "1.36", features = ["serde-with-str"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Collections
dashmap = "6.1"

# Stats / math
statrs = "0.17"

# Config
dotenv = "0.15"

# Vendored in-tree
v3-mm-core = { path = "crates/v3-mm-core" }
v3-mm-exchange = { path = "crates/v3-mm-exchange" }
v3-mm-risk = { path = "crates/v3-mm-risk" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
